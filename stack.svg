<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 128" width="900" height="128" role="img" aria-label="Built with zero dependencies, zero build step, one file">
<defs>
  <style>
    .col { opacity:0; animation: rise 6s cubic-bezier(.16,1,.3,1) infinite; }
    .c2{animation-delay:.16s}.c3{animation-delay:.32s}.c4{animation-delay:.48s}
    @keyframes rise {
      0%      { opacity:0; transform: translateY(12px); }
      14%,86% { opacity:1; transform: translateY(0); }
      100%    { opacity:0; transform: translateY(0); }
    }
    .bar { animation: grow 6s cubic-bezier(.16,1,.3,1) infinite; transform-origin: left center; }
    .b2{animation-delay:.16s}.b3{animation-delay:.32s}.b4{animation-delay:.48s}
    @keyframes grow { 0%{transform:scaleX(0)} 22%,88%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
    text { fill:#D9D7D4; }
    .n { font-family: Georgia,'Times New Roman',serif; font-size:38px; }
    .l { font-family:'Helvetica Neue',Arial,sans-serif; font-weight:500; font-size:10px; letter-spacing:3.2px; }
  </style>
</defs>
<rect width="900" height="128" fill="#090B09"/>

<g transform="translate(64,0)">
  <g class="col">
    <text class="n" x="0" y="62">0</text>
    <text class="l" x="0" y="86" opacity=".5">DEPENDENCIES</text>
    <rect class="bar" x="0" y="98" width="130" height="1" fill="#D9D7D4" opacity=".22"/>
  </g>
</g>
<g transform="translate(274,0)">
  <g class="col c2">
    <text class="n" x="0" y="62">0</text>
    <text class="l" x="0" y="86" opacity=".5">BUILD STEP</text>
    <rect class="bar b2" x="0" y="98" width="130" height="1" fill="#D9D7D4" opacity=".22"/>
  </g>
</g>
<g transform="translate(484,0)">
  <g class="col c3">
    <text class="n" x="0" y="62">1</text>
    <text class="l" x="0" y="86" opacity=".5">HTML FILE</text>
    <rect class="bar b3" x="0" y="98" width="130" height="1" fill="#D9D7D4" opacity=".22"/>
  </g>
</g>
<g transform="translate(694,0)">
  <g class="col c4">
    <text class="n" x="0" y="62">6</text>
    <text class="l" x="0" y="86" opacity=".5">SECTIONS</text>
    <rect class="bar b4" x="0" y="98" width="130" height="1" fill="#D9D7D4" opacity=".22"/>
  </g>
</g>
</svg>
