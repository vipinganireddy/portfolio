<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 128" width="900" height="128" role="img" aria-label="Zero dependencies, zero build step, one HTML file, six sections">
<rect width="900" height="128" fill="#090B09"/>

<!-- col 1: 0 DEPENDENCIES -->
<g>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.9;1" dur="5s" repeatCount="indefinite"/>
  <text x="64" y="62"
        font-family="Georgia,'Times New Roman',serif"
        font-size="38" letter-spacing="1" fill="#D9D7D4">0</text>
  <text x="64" y="86"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500"
        font-size="10" letter-spacing="3.2" fill="#D9D7D4" opacity=".5">DEPENDENCIES</text>
  <line x1="64" y1="98" x2="194" y2="98" stroke="#D9D7D4" stroke-opacity=".22" stroke-width="1">
    <animate attributeName="x2" values="64;194;194" keyTimes="0;0.2;1" dur="5s" repeatCount="indefinite"/>
  </line>
</g>

<!-- col 2: 0 BUILD STEP -->
<g>
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.2;0.9;1" dur="5s" repeatCount="indefinite"/>
  <text x="274" y="62"
        font-family="Georgia,'Times New Roman',serif"
        font-size="38" letter-spacing="1" fill="#D9D7D4">0</text>
  <text x="274" y="86"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500"
        font-size="10" letter-spacing="3.2" fill="#D9D7D4" opacity=".5">BUILD STEP</text>
  <line x1="274" y1="98" x2="404" y2="98" stroke="#D9D7D4" stroke-opacity=".22" stroke-width="1">
    <animate attributeName="x2" values="274;274;404;404" keyTimes="0;0.14;0.34;1" dur="5s" repeatCount="indefinite"/>
  </line>
</g>

<!-- col 3: 1 HTML FILE -->
<g>
  <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.12;0.16;0.28;0.9;1" dur="5s" repeatCount="indefinite"/>
  <text x="484" y="62"
        font-family="Georgia,'Times New Roman',serif"
        font-size="38" letter-spacing="1" fill="#D9D7D4">1</text>
  <text x="484" y="86"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500"
        font-size="10" letter-spacing="3.2" fill="#D9D7D4" opacity=".5">HTML FILE</text>
  <line x1="484" y1="98" x2="614" y2="98" stroke="#D9D7D4" stroke-opacity=".22" stroke-width="1">
    <animate attributeName="x2" values="484;484;484;614;614" keyTimes="0;0.18;0.22;0.44;1" dur="5s" repeatCount="indefinite"/>
  </line>
</g>

<!-- col 4: 6 SECTIONS -->
<g>
  <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.16;0.2;0.24;0.36;0.9;1" dur="5s" repeatCount="indefinite"/>
  <text x="694" y="62"
        font-family="Georgia,'Times New Roman',serif"
        font-size="38" letter-spacing="1" fill="#D9D7D4">6</text>
  <text x="694" y="86"
        font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500"
        font-size="10" letter-spacing="3.2" fill="#D9D7D4" opacity=".5">SECTIONS</text>
  <line x1="694" y1="98" x2="824" y2="98" stroke="#D9D7D4" stroke-opacity=".22" stroke-width="1">
    <animate attributeName="x2" values="694;694;694;694;824;824" keyTimes="0;0.22;0.26;0.3;0.52;1" dur="5s" repeatCount="indefinite"/>
  </line>
</g>
</svg>
