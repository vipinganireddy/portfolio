<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190" role="img" aria-label="A ship holds the left of the screen and fires at drones and hulks drifting in from the right">
<defs>
  <linearGradient id="exhaust" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0"  stop-color="#c6d0bc" stop-opacity=".88"/>
    <stop offset=".6" stop-color="#c6d0bc" stop-opacity=".28"/>
    <stop offset="1"  stop-color="#c6d0bc" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="vig" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#090B09" stop-opacity="1"/>
    <stop offset=".06" stop-color="#090B09" stop-opacity="0"/>
    <stop offset=".93" stop-color="#090B09" stop-opacity="0"/>
    <stop offset="1"   stop-color="#090B09" stop-opacity="1"/>
  </linearGradient>
</defs>

<rect width="900" height="190" fill="#090B09"/>
<line x1="0" y1="26" x2="900" y2="26" stroke="#D9D7D4" stroke-opacity=".13"/>

<!-- stars three depths -->
<g fill="#D9D7D4">
  <!-- deep: slow -->
  <g opacity=".18">
    <circle cx="0"   cy="55"  r="1"><animateTransform attributeName="transform" type="translate" values="80 0;-820 0;80 0" dur="28s" repeatCount="indefinite"/></circle>
    <circle cx="0"   cy="130" r="1"><animateTransform attributeName="transform" type="translate" values="260 0;-640 0;260 0" dur="28s" repeatCount="indefinite"/></circle>
    <circle cx="0"   cy="78"  r="1"><animateTransform attributeName="transform" type="translate" values="490 0;-410 0;490 0" dur="28s" repeatCount="indefinite"/></circle>
    <circle cx="0"   cy="155" r="1"><animateTransform attributeName="transform" type="translate" values="680 0;-220 0;680 0" dur="28s" repeatCount="indefinite"/></circle>
    <circle cx="0"   cy="40"  r="1"><animateTransform attributeName="transform" type="translate" values="820 0;-80 0;820 0" dur="28s" repeatCount="indefinite"/></circle>
  </g>
  <!-- mid -->
  <g opacity=".32">
    <circle cx="0" cy="92"  r="1.2"><animateTransform attributeName="transform" type="translate" values="130 0;-770 0;130 0" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="48"  r="1.2"><animateTransform attributeName="transform" type="translate" values="330 0;-570 0;330 0" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="144" r="1.2"><animateTransform attributeName="transform" type="translate" values="560 0;-340 0;560 0" dur="18s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="70"  r="1.2"><animateTransform attributeName="transform" type="translate" values="760 0;-140 0;760 0" dur="18s" repeatCount="indefinite"/></circle>
  </g>
  <!-- near: fastest -->
  <g opacity=".52">
    <circle cx="0" cy="118" r="1.7"><animateTransform attributeName="transform" type="translate" values="210 0;-690 0;210 0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="62"  r="1.7"><animateTransform attributeName="transform" type="translate" values="440 0;-460 0;440 0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="152" r="1.7"><animateTransform attributeName="transform" type="translate" values="650 0;-250 0;650 0" dur="9s" repeatCount="indefinite"/></circle>
  </g>
</g>

<!-- enemies drifting right to left -->
<!-- drone 1 -->
<g fill="none" stroke="#D9D7D4" stroke-opacity=".8" stroke-width="1.7" stroke-linejoin="round">
  <g>
    <animateTransform attributeName="transform" type="translate" values="900 58;-10 58;900 58" dur="5.5s" repeatCount="indefinite"/>
    <path d="M-10 0 L7 -8 L3 0 L7 8 Z"/>
  </g>
</g>
<!-- drone 2 -->
<g fill="none" stroke="#D9D7D4" stroke-opacity=".8" stroke-width="1.7" stroke-linejoin="round">
  <g>
    <animateTransform attributeName="transform" type="translate" values="900 130;-10 130;900 130" dur="6.8s" begin="-2.8s" repeatCount="indefinite"/>
    <path d="M-10 0 L7 -8 L3 0 L7 8 Z"/>
  </g>
</g>
<!-- drone 3 -->
<g fill="none" stroke="#D9D7D4" stroke-opacity=".8" stroke-width="1.7" stroke-linejoin="round">
  <g>
    <animateTransform attributeName="transform" type="translate" values="900 88;-10 88;900 88" dur="7.6s" begin="-4.9s" repeatCount="indefinite"/>
    <path d="M-10 0 L7 -8 L3 0 L7 8 Z"/>
  </g>
</g>
<!-- hulk (spinning) -->
<g fill="none" stroke="#D9D7D4" stroke-opacity=".7" stroke-width="1.8" stroke-linejoin="round">
  <g>
    <animateTransform attributeName="transform" type="translate" values="900 52;-10 52;900 52" dur="10s" begin="-5s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="8s" repeatCount="indefinite"/>
      <path d="M15 0 L9 12 L-5 15 L-15 4 L-12 -9 L2 -15 L13 -9 Z"/>
      <circle cx="0" cy="0" r="4.5" stroke-opacity=".4"/>
    </g>
  </g>
</g>

<!-- shots: 4 bolts crossing the field, evenly staggered -->
<g stroke="#D9D7D4" stroke-linecap="round">
  <line x1="0" y1="95" x2="12" y2="95" stroke-width="2.1" stroke-opacity=".95">
    <animateTransform attributeName="transform" type="translate" values="118 0;878 0;118 0" dur="1.1s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="95" x2="12" y2="95" stroke-width="2.1" stroke-opacity=".95">
    <animateTransform attributeName="transform" type="translate" values="118 0;878 0;118 0" dur="1.1s" begin="-0.275s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="95" x2="12" y2="95" stroke-width="2.1" stroke-opacity=".95">
    <animateTransform attributeName="transform" type="translate" values="118 0;878 0;118 0" dur="1.1s" begin="-0.55s" repeatCount="indefinite"/>
  </line>
  <line x1="0" y1="95" x2="12" y2="95" stroke-width="2.1" stroke-opacity=".95">
    <animateTransform attributeName="transform" type="translate" values="118 0;878 0;118 0" dur="1.1s" begin="-0.825s" repeatCount="indefinite"/>
  </line>
</g>

<!-- ship (bobs up and down) -->
<g>
  <animateTransform attributeName="transform" type="translate" values="100 -26; 100 18; 100 -26" dur="3.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1; 0.5 0 0.5 1"/>

  <!-- exhaust -->
  <rect x="70" y="92.5" width="20" height="5" fill="url(#exhaust)" rx="2.5">
    <animate attributeName="width" values="18;10;20;14;18" dur="0.18s" repeatCount="indefinite"/>
  </rect>
  <!-- hull -->
  <path d="M116 95 L89 106 L94 95 L89 84 Z"
        fill="none" stroke="#D9D7D4" stroke-opacity=".95" stroke-width="1.9" stroke-linejoin="round"/>
  <line x1="97" y1="95" x2="108" y2="95" stroke="#D9D7D4" stroke-opacity=".5" stroke-width="1.2"/>
</g>

<!-- kill flash: expanding ring at a fixed point -->
<circle cx="600" cy="110" r="4" fill="none" stroke="#D9D7D4" stroke-width="1.6">
  <animate attributeName="r"       values="4;22;4"    dur="3.2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.9;0;0.9" dur="3.2s" repeatCount="indefinite"/>
</circle>

<rect width="900" height="190" fill="url(#vig)"/>

<!-- HUD text: static, no animation needed -->
<text x="20" y="18"
      font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500"
      font-size="10.5" letter-spacing="3.4" fill="#D9D7D4" opacity=".45">HOLD THE LINE</text>
<text x="880" y="18" text-anchor="end"
      font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500"
      font-size="11" letter-spacing="2.6" fill="#D9D7D4" opacity=".55">0412 / 1180</text>
<text x="450" y="182" text-anchor="middle"
      font-family="'Helvetica Neue',Arial,sans-serif" font-weight="500"
      font-size="9.5" letter-spacing="3.6" fill="#D9D7D4" opacity=".38">ARROWS TO MOVE &#183; SPACE TO FIRE</text>
</svg>
