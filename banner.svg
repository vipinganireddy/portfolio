<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Ganireddy Sudhanshu Vipin — Web Development and Marketing">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0d100d"/>
    <stop offset=".55" stop-color="#090B09"/>
    <stop offset="1" stop-color="#060806"/>
  </linearGradient>
  <radialGradient id="glow" cx=".72" cy=".28" r=".7">
    <stop offset="0" stop-color="#c6d0bc" stop-opacity=".12"/>
    <stop offset="1" stop-color="#c6d0bc" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#c6d0bc" stop-opacity="0"/>
    <stop offset=".5" stop-color="#c6d0bc" stop-opacity=".24"/>
    <stop offset="1" stop-color="#c6d0bc" stop-opacity="0"/>
  </linearGradient>
  <filter id="bl"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="bl2"><feGaussianBlur stdDeviation="12"/></filter>
  <mask id="wipe">
    <rect x="0" y="0" width="1200" height="340" fill="#fff">
      <animate attributeName="width" values="0;1200;1200" keyTimes="0;0.5;1" dur="7s" repeatCount="indefinite"/>
    </rect>
  </mask>
</defs>

<rect width="1200" height="340" fill="url(#sky)"/>
<rect width="1200" height="340" fill="url(#glow)"/>

<!-- far treeline -->
<path fill="#141814" d="M0 340V252l18-22 14 20 12-26 16 26 14-24 16 26 16-22 16 24 16-22 16 24 14-26 18 26 14-22 18 24 16-24 16 22 18-24 16 26 16-22 18 26 14-24 14 22 18-26 16 24 14-20 18 24 16-24 14 22 18-26 16 22 14-24 18 26 16-22 16 24 18-24 14 22 18-26 16 24 14-22 18 24 16-24 14 22 18-26 16 24 14-20 18 24 16-24 14 22 18-26 16 24 14-20 16 24V340Z"/>

<!-- near treeline -->
<path fill="#0c100c" d="M0 340V270l18-28 14 24 12-30 16 28 14-26 16 28 16-26 18 28 16-28 18 26 14-28 18 28 14-26 18 28 16-26 16 28 18-28 14 26 18-28 16 28 16-26 18-28 14 28 18-26 16 28 14-28 18 26 16-28 16 28 18-26 14 28 18-28 16 26 14-28 18 28 16-26 18-28 14 28 18-26 16 28 14-28 18 26 16-28 16 28 18-26 14 28 18-28 16 26 14-28 18 28V340Z"/>

<!-- fog: two ellipses drifting left then right using SMIL -->
<g filter="url(#bl)">
  <ellipse cx="0" cy="248" rx="300" ry="36" fill="url(#fg)" opacity=".8">
    <animateTransform attributeName="transform" type="translate"
      values="-300 0; 1500 0; -300 0" dur="24s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="0" cy="268" rx="360" ry="32" fill="url(#fg)" opacity=".7">
    <animateTransform attributeName="transform" type="translate"
      values="400 0; -800 0; 400 0" dur="32s" repeatCount="indefinite"/>
  </ellipse>
</g>
<g filter="url(#bl2)">
  <ellipse cx="0" cy="255" rx="220" ry="24" fill="url(#fg)" opacity=".65">
    <animateTransform attributeName="transform" type="translate"
      values="-100 0; 1300 0; -100 0" dur="19s" repeatCount="indefinite"/>
  </ellipse>
</g>

<!-- ground veil -->
<rect x="0" y="256" width="1200" height="84" fill="#090B09" opacity=".58"/>
<rect x="0" y="312" width="1200" height="28" fill="#090B09"/>

<!-- name, wiped in by the mask -->
<g mask="url(#wipe)">
  <text x="600" y="110" text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-size="19" letter-spacing="11" fill="#D9D7D4" opacity=".78">GANIREDDY</text>
  <text x="600" y="196" text-anchor="middle"
        font-family="Georgia,'Times New Roman',serif"
        font-weight="300" font-size="77" letter-spacing="2" fill="#D9D7D4">Sudhanshu Vipin</text>
</g>

<!-- rule draws itself -->
<line x1="360" y1="228" x2="840" y2="228"
      stroke="#D9D7D4" stroke-opacity=".26" stroke-width="1"
      stroke-dasharray="480" stroke-dashoffset="480">
  <animate attributeName="stroke-dashoffset" values="480;0;0" keyTimes="0;0.52;1" dur="7s" repeatCount="indefinite"/>
</line>

<!-- subtitle pair -->
<text x="600" y="264" text-anchor="middle"
      font-family="'Helvetica Neue',Arial,sans-serif"
      font-weight="500" font-size="14" letter-spacing="6.5" fill="#D9D7D4">
  WEB DEVELOPMENT &#183; MARKETING
  <animate attributeName="opacity" values="0;0;0.82;0.82" keyTimes="0;0.36;0.56;1" dur="7s" repeatCount="indefinite"/>
</text>
<text x="600" y="299" text-anchor="middle"
      font-family="'Helvetica Neue',Arial,sans-serif"
      font-weight="500" font-size="11.5" letter-spacing="4.5" fill="#D9D7D4">
  BITS PILANI, DUBAI CAMPUS
  <animate attributeName="opacity" values="0;0;0;0.6;0.6" keyTimes="0;0.42;0.52;0.66;1" dur="7s" repeatCount="indefinite"/>
</text>

<!-- monogram -->
<text x="1148" y="58" text-anchor="middle"
      font-family="Georgia,'Times New Roman',serif"
      font-size="34" letter-spacing="2" fill="#D9D7D4" opacity=".48">GSV</text>
</svg>
